name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 \
            libdbus-1-3 libfontconfig1 \
            patchelf

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller \
            --clean --noconfirm --windowed \
            --name inf-avis \
            --add-data "gui:gui" \
            --add-data "api:api" \
            --add-data "database.py:." \
            --add-data "paths.py:." \
            --hidden-import=PyQt6.QtSvg \
            --hidden-import=certifi \
            --exclude-module=tkinter \
            --exclude-module=matplotlib \
            --exclude-module=numpy \
            --exclude-module=pytest \
            main.py

      - name: Create portable launcher
        run: |
          mkdir -p dist/inf-avis
          cp -r dist/inf-avis/* dist/inf-avis/
          cat > dist/inf-avis/inf-avis << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          export INF_AVIS_PORTABLE=1
          exec "./inf-avis" "$@"
          EOF
          chmod +x dist/inf-avis/inf-avis

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="inf-avis-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "${TARBALL}" -C dist inf-avis
          echo "TARBALL=${TARBALL}" >> $GITHUB_OUTPUT
        id: package

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ steps.package.outputs.TARBALL }}
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller ^
            --clean --noconfirm --windowed ^
            --name "INF Avis" ^
            --add-data "gui;gui" ^
            --add-data "api;api" ^
            --add-data "database.py;." ^
            --add-data "paths.py;." ^
            --hidden-import=PyQt6.QtSvg ^
            --hidden-import=certifi ^
            --exclude-module=tkinter ^
            --exclude-module=matplotlib ^
            --exclude-module=numpy ^
            --exclude-module=pytest ^
            main.py

      - name: Package zip
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zipName = "inf-avis-${version}-win64.zip"
          Compress-Archive -Path "dist\INF Avis" -DestinationPath $zipName
          echo "ZIP=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh
        id: package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ steps.package.outputs.ZIP }}
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: INF Avis ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux/*.tar.gz
            artifacts/windows/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}